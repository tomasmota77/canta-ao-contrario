<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF5B2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Contrário">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23FF5B2E'/%3E%3Ccircle cx='50' cy='50' r='26' fill='white'/%3E%3Ccircle cx='50' cy='50' r='10' fill='%23FF5B2E'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}</style>
<title>Canta ao Contrário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@500;800&family=Funnel+Sans:wght@500;600;700&display=swap">
<style>
/* Layout: um ecrã por fase, cor inteira. Frase grande em cima, um botão central que reage ao som, dois botões pequenos ao lado. Visual único por fase (não segue o tema claro/escuro, de propósito). */
:root {
  color-scheme: light;
  --tomato: #FF5B2E;
  --ultra: #2E2BF5;
  --butter: #FFE14A;
  --ink: #170A05;
  --white: #FFFFFF;
  --bg: var(--tomato);
  --fg: var(--ink);
  --display: "Funnel Display", "Arial Black", system-ui, sans-serif;
  --ui: "Funnel Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
:root[data-phase="listen"] { --bg: var(--ultra); --fg: var(--white); }
:root[data-phase="result"] { --bg: var(--butter); --fg: var(--ink); }
:root[data-phase="dark"] { --bg: var(--ink); --fg: var(--white); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--ui);
  transition: background-color .45s ease, color .45s ease;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

.app {
  height: 100%;
  max-width: 480px; margin: 0 auto;
  display: grid; grid-template-rows: auto 1fr auto auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 16px 22px;
}

/* topo */
.bar { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; height: 40px; }
.bar-center { display: flex; justify-content: center; min-width: 0; }
.dots { display: flex; gap: 6px; }
.dots i { width: 8px; height: 8px; border-radius: 99px; background: currentColor; opacity: .25; transition: width .35s cubic-bezier(.3,.7,.2,1), opacity .35s; }
.dots i.done { opacity: .6; }
.dots i.now { width: 26px; opacity: 1; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 1.05rem;
  background: color-mix(in srgb, var(--fg) 10%, transparent); }

/* palco */
.stage { display: flex; flex-direction: column; justify-content: center; gap: 18px; min-height: 0; padding-bottom: 8px; }
.kicker { margin: 0; font-weight: 600; font-size: 1rem; opacity: .7; }
.phrase {
  margin: 0; font-family: var(--display); font-weight: 800;
  font-size: clamp(2.2rem, 10.5vw, 3.4rem); line-height: .98; letter-spacing: -.035em;
  text-wrap: balance; overflow-wrap: anywhere;
}
.phrase.flip { animation: flip .5s cubic-bezier(.3,.7,.2,1); }
@keyframes flip { 0% { transform: scaleX(1); } 45% { transform: scaleX(0); } 55% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
.pill {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 8px;
  height: 40px; padding: 0 16px 0 12px; border-radius: 99px; font-weight: 600; font-size: .95rem;
  background: color-mix(in srgb, var(--fg) 10%, transparent);
}
.pill svg { width: 18px; height: 18px; }
.pill:active { transform: scale(.96); }

.score { display: flex; flex-direction: column; gap: 6px; }
.score-num { font-family: var(--display); font-weight: 800; font-size: clamp(8rem, 46vw, 12rem); line-height: .8; letter-spacing: -.06em; font-variant-numeric: tabular-nums; }
.verdict { font-family: var(--display); font-weight: 800; font-size: 2rem; letter-spacing: -.02em; line-height: 1; }
.best { font-weight: 600; opacity: .6; font-size: .95rem; }

/* controlos */
.controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.side { display: flex; justify-content: center; }
.mini { display: flex; flex-direction: column; align-items: center; gap: 7px; font-weight: 600; font-size: .82rem; }
.mini .disc { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--fg) 12%, transparent); transition: transform .12s; }
.mini svg { width: 22px; height: 22px; }
.mini:active .disc { transform: scale(.92); }
.mini.on .disc { background: var(--fg); color: var(--bg); }

.core { position: relative; width: 236px; height: 236px; display: grid; place-items: center; }
.core canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.big {
  position: relative; width: 112px; height: 112px; border-radius: 50%;
  background: var(--white); color: var(--bg);
  display: grid; place-items: center;
  box-shadow: 0 14px 34px -10px color-mix(in srgb, var(--ink) 45%, transparent);
  transition: transform .15s cubic-bezier(.3,.7,.2,1), background-color .45s, color .45s;
}
:root[data-phase="result"] .big { background: var(--ink); color: var(--butter); }
.big:active { transform: scale(.93); }
.big svg { width: 40px; height: 40px; }
.big input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.big:focus-visible, .big:focus-within, .mini:focus-visible, .pill:focus-visible, .icon-btn:focus-visible { outline: 3px solid var(--fg); outline-offset: 4px; }
.idle .big { animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.04); } }

.hint { margin: 0; min-height: 44px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 1rem; opacity: .8; font-variant-numeric: tabular-nums; }
.hint .pill { align-self: center; opacity: 1; }

/* toast e ajuda */
.toast {
  position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  width: min(420px, calc(100% - 32px)); background: var(--ink); color: var(--white);
  padding: 12px 16px; border-radius: 16px; font-weight: 500; font-size: .95rem; line-height: 1.35; z-index: 20;
}
.sheet-wrap { position: fixed; inset: 0; z-index: 30; background: rgba(23,10,5,.4); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 480px; background: var(--white); color: var(--ink); border-radius: 28px 28px 0 0;
  padding: 26px max(24px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
.sheet h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 1.7rem; letter-spacing: -.02em; line-height: 1; }
.sheet ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; font-size: 1.02rem; font-weight: 500; }
.sheet li { display: flex; gap: 12px; align-items: center; }
.sheet li b { width: 28px; height: 28px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: .85rem; color: var(--white); }
.tally { display: flex; align-items: baseline; gap: 8px; font-family: var(--display); font-weight: 800; font-size: 1.35rem; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.tally small { font-family: var(--ui); font-weight: 600; font-size: .78rem; opacity: .6; letter-spacing: 0; }
.tally i { font-style: normal; opacity: .35; }
.choices { display: flex; gap: 10px; width: 100%; }
.choice { flex: 1; height: 60px; border-radius: 99px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 1.08rem; transition: transform .12s; }
.choice svg { width: 20px; height: 20px; }
.choice:active { transform: scale(.96); }
.choice.no { background: color-mix(in srgb, var(--fg) 14%, transparent); }
.choice.yes { background: var(--butter); color: var(--ink); }
.choice:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
.hint:has(.choices) { opacity: 1; }
.sheet .row { display: flex; gap: 10px; }
.sheet .row > * { flex: 1; }
.sheet .ghost { height: 54px; border-radius: 99px; background: #F3EFEC; color: var(--ink); font-weight: 700; font-size: 1.02rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
.sheet .ghost svg { width: 18px; height: 18px; }

/* início */
.home {
  height: 100%; max-width: 480px; margin: 0 auto; position: relative;
  display: grid; grid-template-rows: auto 1fr auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 16px 24px;
}
.home-top { display: flex; justify-content: space-between; align-items: center; height: 40px; }
.lang-btn { height: 40px; padding: 0 14px 0 11px; border-radius: 99px; background: rgba(255,255,255,.1); color: var(--white); display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: .92rem; letter-spacing: .03em; }
.lang-btn svg { width: 18px; height: 18px; }
.lang-btn:focus-visible { outline: 3px solid var(--white); outline-offset: 3px; }
.hero { display: flex; flex-direction: column; justify-content: center; gap: 34px; }
.bars { display: flex; align-items: center; gap: 5px; height: 96px; }
.bars i {
  flex: 1; height: 100%; border-radius: 99px; background: var(--tomato);
  transform: scaleY(var(--h)); transform-origin: center;
  animation: wave 1.5s ease-in-out infinite alternate; animation-delay: calc(var(--d) * -1s);
}
.bars i:nth-child(n+15) { background: #7C78FF; }
@keyframes wave { from { transform: scaleY(calc(var(--h) * .25)); } to { transform: scaleY(var(--h)); } }
.brandmark { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(3.4rem, 17.5vw, 5.2rem); line-height: .86; letter-spacing: -.05em; }
.brandmark .l1 { display: block; }
.flipword { display: inline-block; color: var(--tomato); transform-origin: 50% 50%; transition: transform .9s cubic-bezier(.5,1.6,.4,1); }
.flipword.rev { transform: scaleX(-1); color: #7C78FF; }
.flipword { transition: transform .9s cubic-bezier(.5,1.6,.4,1), color .9s; }
.home-sub { margin: -14px 0 0; font-size: 1.08rem; font-weight: 500; opacity: .55; }
.cta { display: grid; gap: 10px; }
.cta-main {
  height: 68px; border-radius: 99px; background: var(--tomato); color: var(--ink);
  font-family: var(--display); font-weight: 800; font-size: 1.4rem; letter-spacing: -.02em;
  display: flex; align-items: center; justify-content: center; gap: 12px;
  box-shadow: 0 16px 40px -14px rgba(255,91,46,.65);
  transition: transform .15s cubic-bezier(.3,.7,.2,1);
}
.cta-main svg { width: 26px; height: 26px; }
.cta-alt { height: 56px; border-radius: 99px; font-weight: 700; font-size: 1.05rem; background: rgba(255,255,255,.1); color: var(--white); transition: transform .15s; }
.cta-main:active, .cta-alt:active { transform: scale(.97); }
.cta-main:focus-visible, .cta-alt:focus-visible { outline: 3px solid var(--white); outline-offset: 3px; }
.icon-btn svg { width: 20px; height: 20px; }
.muted { margin: -8px 0 0; font-size: .98rem; color: #6B5E58; }
.miclist { display: grid; gap: 8px; }
.micopt { display: grid; gap: 8px; text-align: left; padding: 14px 16px; border-radius: 16px; background: #F3EFEC; color: var(--ink); font-weight: 600; font-size: 1rem; }
.micopt[aria-pressed="true"] { background: var(--ink); color: var(--white); }
.micopt small { font-weight: 500; opacity: .65; font-size: .82rem; }
.meter { height: 8px; border-radius: 99px; background: color-mix(in srgb, currentColor 18%, transparent); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--tomato); border-radius: 99px; transition: width .08s linear; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 600; font-size: .98rem; padding: 4px 2px; }
.switch input { appearance: none; -webkit-appearance: none; margin: 0; flex: none; width: 50px; height: 30px; border-radius: 99px; background: #E4DEDA; position: relative; cursor: pointer; transition: background .2s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--white); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch input:checked { background: var(--ink); }
.switch input:checked::after { transform: translateX(20px); }
.switch input:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.sheet .ok { height: 54px; border-radius: 99px; background: var(--ink); color: var(--white); font-weight: 700; font-size: 1.02rem; }

@media (prefers-reduced-motion: reduce) {
  .bars i { animation: none; }
  .flipword { transition: none; }
  body, .dots i, .big { transition: none; }
  .phrase.flip, .idle .big { animation: none; }
}
@media (max-height: 640px) {
  .core { width: 196px; height: 196px; }
  .big { width: 96px; height: 96px; }
  .phrase { font-size: clamp(1.9rem, 9vw, 2.6rem); }
  .score-num { font-size: 7rem; }
}
</style>

</head>
<body>
<div class="home" id="home">
  <div class="home-top"><button class="lang-btn" id="lang-btn" type="button" aria-label="Idioma" data-i18n-aria="language"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span id="lang-code">PT</span></button><button class="icon-btn" id="home-help" type="button" aria-label="Como se joga" data-i18n-aria="howTo">?</button></div>
  <div class="hero">
    <div class="bars" aria-hidden="true"><i style="--h:0.3;--d:0.00"></i><i style="--h:0.45;--d:0.11"></i><i style="--h:0.62;--d:0.22"></i><i style="--h:0.4;--d:0.33"></i><i style="--h:0.78;--d:0.44"></i><i style="--h:0.95;--d:0.55"></i><i style="--h:0.58;--d:0.66"></i><i style="--h:0.84;--d:0.77"></i><i style="--h:1;--d:0.88"></i><i style="--h:0.7;--d:0.99"></i><i style="--h:0.5;--d:1.10"></i><i style="--h:0.88;--d:1.21"></i><i style="--h:0.64;--d:1.32"></i><i style="--h:0.36;--d:1.43"></i><i style="--h:0.36;--d:0.00"></i><i style="--h:0.64;--d:0.11"></i><i style="--h:0.88;--d:0.22"></i><i style="--h:0.5;--d:0.33"></i><i style="--h:0.7;--d:0.44"></i><i style="--h:1;--d:0.55"></i><i style="--h:0.84;--d:0.66"></i><i style="--h:0.58;--d:0.77"></i><i style="--h:0.95;--d:0.88"></i><i style="--h:0.78;--d:0.99"></i><i style="--h:0.4;--d:1.10"></i><i style="--h:0.62;--d:1.21"></i><i style="--h:0.45;--d:1.32"></i><i style="--h:0.3;--d:1.43"></i></div>
    <h1 class="brandmark"><span class="l1" data-i18n="title1">Canta ao</span><span class="flipword" id="flipword" data-i18n="title2">Contrário</span></h1>
    <p class="home-sub" data-i18n="sub">Ouve ao contrário. Imita. Adivinha.</p>
  </div>
  <div class="cta">
    <button class="cta-main" id="start-duo" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.4" fill="currentColor"/><path d="M2.5 19.5c.6-3.6 3.2-5.6 6.5-5.6s5.9 2 6.5 5.6" fill="currentColor"/><circle cx="17" cy="9" r="2.7" fill="currentColor" opacity=".55"/><path d="M15.8 14.2c2.9-.3 5.2 1.4 5.7 4.8h-4.4" fill="currentColor" opacity=".55"/></svg><span data-i18n="playFriends">Jogar com amigos</span></button>
    <button class="cta-alt" id="start-solo" type="button" data-i18n="playSolo">Treinar sozinho</button>
  </div>
</div>

<div class="app idle" id="app" hidden>
  <header class="bar">
    <button class="icon-btn" id="home-btn" type="button" aria-label="Voltar ao início" data-i18n-aria="back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="bar-center">
      <div class="dots" id="dots" aria-hidden="true"></div>
      <span class="tally" id="tally" hidden></span>
    </div>
    <button class="icon-btn" id="help" type="button" aria-label="Como se joga e microfone" data-i18n-aria="helpAria">?</button>
  </header>

  <main class="stage" aria-live="polite">
    <div id="words">
      <p class="kicker" id="kicker">Diz isto</p>
    </div>
    <h1 class="phrase" id="phrase">O rato roeu a rolha da garrafa do rei da Rússia</h1>
    <button class="pill" id="shuffle" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3.5c2 0 3.2 1 4.3 2.7l1.4 2.2C14.4 13.8 15.6 15 17.6 15H20M4 15h3.5c1.2 0 2.1-.4 2.9-1.1M14.5 8.1c.8-.7 1.7-1.1 3-1.1H20M17.5 4.5 20 7l-2.5 2.5M17.5 12.5 20 15l-2.5 2.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-i18n="shuffle">Outra frase</span>
    </button>
    <div class="score" id="score" hidden>
      <span class="score-num" id="score-num">0</span>
      <span class="verdict" id="verdict"></span>
      <span class="best" id="best"></span>
    </div>
  </main>

  <div class="controls">
    <div class="side" id="left"></div>
    <div class="core">
      <canvas id="ring" aria-hidden="true"></canvas>
      <div id="big-slot"></div>
    </div>
    <div class="side" id="right"></div>
  </div>
  <div class="hint" id="hint">Toca para gravar</div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<div class="sheet-wrap" id="langsheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="lang-title">
    <h2 id="lang-title" data-i18n="language">Idioma</h2>
    <div class="miclist" id="langlist"></div>
  </div>
</div>

<div class="sheet-wrap" id="micsheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mic-title">
    <h2 id="mic-title" data-i18n="mic">Microfone</h2>
    <p class="muted" data-i18n="micHint">Escolhe um e fala. A barra tem de mexer.</p>
    <div class="miclist" id="miclist"></div>
    <label class="switch" for="mic-call"><span data-i18n="callMode">Modo chamada</span><input type="checkbox" id="mic-call"></label>
    <button class="ok" id="mic-ok" type="button" data-i18n="done">Feito</button>
  </div>
</div>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title" data-i18n="howTo">Como se joga</h2>
    <ol id="help-list"></ol>
    <div class="row">
      <button class="ghost" id="mic" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span data-i18n="mic">Microfone</span></button>
      <button class="ok" id="sheet-ok" type="button" data-i18n="go">Bora</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;

    S.orig = S.origrev = S.imit = S.result = null;
    go(1);
  }

  function renderSolo() {
    const st = S.step;

    const phrase = PHRASES[pIdx];
    const mode = st === 1 ? "fwd" : "rev";
    const ph = $("phrase");
    const txt = mode === "fwd" ? phrase : reverseText(phrase);
    if (ph.textContent !== txt) {
      ph.textContent = txt;
      if (mode !== lastPhraseMode) { ph.classList.remove("flip"); void ph.offsetWidth; ph.classList.add("flip"); }
    }
    lastPhraseMode = mode;
    ph.hidden = st === 4;
    $("kicker").textContent = [t("sayThis"), t("soundsLike"), t("nowImitate"), ""][st - 1];
    $("kicker").hidden = st === 4;
    $("shuffle").hidden = st !== 1 || !!rec;
    $("score").hidden = st !== 4;

    const left = $("left"), right = $("right"), slot = $("big-slot");
    left.innerHTML = ""; right.innerHTML = ""; slot.innerHTML = "";
    const hint = $("hint"); hint.innerHTML = "";

    if (st === 1 || st === 3) {
      slot.append(bigButton(rec ? "stop" : "rec", rec ? t("stop") : t("rec"), toggleMic));
      if (st === 3 && !rec) left.append(mini("back", t("listen"), () => play("origrev"), isPlaying("origrev")));
      if (!rec) hint.textContent = isPlaying("origrev") ? t("playingRev") : micOK ? t("tapRec") : t("pickAudio");
    }
    if (st === 2) {
      slot.append(bigButton(isPlaying("origrev") ? "stop" : "back", t("listenRev"), () => play("origrev")));
      left.append(mini("play", t("original"), () => play("orig"), isPlaying("orig")));
      right.append(mini("next", t("imitate"), () => { stopPlay(); go(3); }));
      hint.textContent = isPlaying("origrev") ? t("playingRev") : isPlaying("orig") ? t("playingOrig") : t("listenAny");
    }
    if (st === 4) {
      slot.append(bigButton(isPlaying("result") ? "stop" : "play", t("resultAria"), () => play("result")));
      left.append(mini("play", t("original"), () => play("orig"), isPlaying("orig")));
      right.append(mini("retry", t("retry"), () => { stopPlay(); S.imit = S.result = null; S.score = null; go(3); }));
      const nb = document.createElement("button");
      nb.type = "button"; nb.className = "pill"; nb.textContent = t("newPhrase");
      nb.addEventListener("click", () => { restart(); shuffle(); });
      hint.append(nb);
    }
  }

  function restart() { stopPlay(); S.orig = S.origrev = S.imit = S.result = null; S.score = null; go(1); }

  /* ---------- início e modos ---------- */
  function showHome() {
    if (rec) return;
    stopPlay();
    S.mode = null;
    $("app").hidden = true; $("home").hidden = false;
    setPhase("dark");
  }
  function startMode(m) {
    audio(); buzz();
    S.mode = m; S.step = 1; S.score = null; S.turn = 0; S.scores = [0, 0];
    S.orig = S.origrev = S.imit = S.result = null;
    lastPhraseMode = "start";
    $("home").hidden = true; $("app").hidden = false;
    render(); drawRing();
  }
  $("start-duo").addEventListener("click", () => startMode("duo"));
  $("start-solo").addEventListener("click", () => startMode("solo"));
  $("home-btn").addEventListener("click", showHome);
  const HELP = {
    solo: [["#FF5B2E", "h_s1"], ["#2E2BF5", "h_s2"], ["#FF5B2E", "h_s3"], ["#170A05", "h_s4"]],
    duo: [["#FF5B2E", "h_d1"], ["#2E2BF5", "h_d2"], ["#FF5B2E", "h_d3"], ["#170A05", "h_d4"]],
  };
  function fillHelp() {
    const ol = $("help-list"); ol.innerHTML = "";
    HELP[S.mode === "solo" ? "solo" : "duo"].forEach(([c, k], i) => {
      const li = document.createElement("li"), b = document.createElement("b");
      b.style.background = c; b.textContent = String(i + 1);
      li.append(b, t(k)); ol.append(li);
    });
  }
  function shuffle() {
    let n; do { n = Math.floor(Math.random() * PHRASES.length); } while (n === pIdx);
    pIdx = n; buzz();
    const ph = $("phrase"); ph.textContent = ""; render();
    ph.classList.remove("flip"); void ph.offsetWidth; ph.classList.add("flip");
  }
  $("shuffle").addEventListener("click", shuffle);

  function countUp(n) {
    $("verdict").textContent = VERDICT(n);
    const t0 = performance.now(), D = 1100, el = $("score-num");
    const tick = (t) => {
      const f = Math.min(1, Math.max(0, (t - t0) / D)), e = 1 - Math.pow(1 - f, 4);
      el.textContent = String(Math.round(n * e));
      if (f < 1) requestAnimationFrame(tick);
    };
    el.textContent = "0"; requestAnimationFrame(tick);
  }
  function readBest() { try { return Number(localStorage.getItem("cac-best") || 0); } catch (e) { return 0; } }
  function saveBest(n) {
    const b = readBest();
    if (n > b) { try { localStorage.setItem("cac-best", String(n)); } catch (e) {} $("best").textContent = b ? t("newBest") : ""; }
    else $("best").textContent = t("best", { n: b });
  }

  /* ---------- ajuda ---------- */
  /* ---------- escolha do microfone ---------- */
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
  let micId = store.get("cac-mic") || "";
  let callMode = store.get("cac-call") === "1";
  $("mic-call").checked = callMode;
  function constraints(id) {
    const a = { echoCancellation: callMode, noiseSuppression: callMode, autoGainControl: true };
    if (id) a.deviceId = { exact: id };
    return { audio: a };
  }
  async function openMic(id) {
    const want = id === undefined ? micId : id;
    try { return await navigator.mediaDevices.getUserMedia(constraints(want)); }
    catch (e) {
      if (want && (e.name === "OverconstrainedError" || e.name === "NotFoundError" || e.name === "NotReadableError")) {
        micId = ""; store.set("cac-mic", "");
        return navigator.mediaDevices.getUserMedia(constraints(""));
      }
      throw e;
    }
  }
  const NAMES = { "speakerphone": "speaker", "headset earpiece": "earpiece", "default": "auto" };
  function niceName(d, i) {
    if (!d.deviceId) return [t("auto"), ""];
    const l = (d.label || "").trim(), k = l.toLowerCase();
    for (const key in NAMES) if (k === key || k.startsWith(key)) return [t(NAMES[key]), l];
    return [l || t("micN", { n: i + 1 }), ""];
  }
  let test = null;
  function stopTest() {
    if (!test) return;
    cancelAnimationFrame(test.raf);
    test.stream.getTracks().forEach((t) => t.stop());
    try { test.node.disconnect(); } catch (e) {}
    test = null;
  }
  async function startTest(id) {
    stopTest();
    let stream;
    try { stream = await openMic(id); } catch (e) { return false; }
    const c = audio(), node = c.createMediaStreamSource(stream), an = c.createAnalyser();
    an.fftSize = 1024; node.connect(an);
    const buf = new Float32Array(an.fftSize);
    test = { stream, node, raf: 0 };
    const t = test;
    const tick = () => {
      if (test !== t) return;
      an.getFloatTimeDomainData(buf);
      let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
      const v = Math.min(1, Math.sqrt(s / buf.length) * 6);
      const bar = document.querySelector('.micopt[aria-pressed="true"] .meter i');
      if (bar) bar.style.width = Math.round(v * 100) + "%";
      t.raf = requestAnimationFrame(tick);
    };
    tick();
    return true;
  }
  async function openMicSheet() {
    if (rec) return;
    stopPlay();
    $("micsheet").hidden = false;
    const list = $("miclist");
    list.textContent = "";
    if (!(navigator.mediaDevices && navigator.mediaDevices.enumerateDevices)) { list.textContent = t("noPicker"); return; }
    const ok = await startTest(micId);
    if (!ok) { list.textContent = t("noMic2"); return; }
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "audioinput");
    const seen = new Set();
    const opts = [{ deviceId: "", label: "default" }].concat(devs.filter((d) => d.deviceId && d.deviceId !== "default" && d.deviceId !== "communications"));
    opts.forEach((d, i) => {
      if (seen.has(d.deviceId)) return; seen.add(d.deviceId);
      const [name, sub] = niceName(d, i);
      const b = document.createElement("button");
      b.type = "button"; b.className = "micopt";
      b.setAttribute("aria-pressed", String(d.deviceId === micId));
      const top = document.createElement("span"); top.textContent = name;
      if (sub && sub !== name) { const sm = document.createElement("small"); sm.textContent = " · " + sub; top.append(sm); }
      const m = document.createElement("span"); m.className = "meter"; m.innerHTML = "<i></i>";
      b.append(top, m);
      b.addEventListener("click", async () => {
        micId = d.deviceId; store.set("cac-mic", micId);
        list.querySelectorAll(".micopt").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
        buzz(); await startTest(micId);
      });
      list.append(b);
    });
    if (!list.querySelector('[aria-pressed="true"]') && list.firstChild) list.firstChild.setAttribute("aria-pressed", "true");
  }
  function closeMicSheet() { stopTest(); $("micsheet").hidden = true; }
  $("mic").addEventListener("click", () => { $("sheet").hidden = true; openMicSheet(); });
  $("mic-ok").addEventListener("click", closeMicSheet);
  $("micsheet").addEventListener("click", (e) => { if (e.target === $("micsheet")) closeMicSheet(); });
  $("mic-call").addEventListener("change", (e) => { callMode = e.target.checked; store.set("cac-call", callMode ? "1" : "0"); if (test) startTest(micId); });
  $("mic").hidden = !micOK;

  const openHelp = () => { fillHelp(); $("sheet").hidden = false; $("sheet-ok").focus(); };
  $("home-help").addEventListener("click", openHelp);
  $("lang-btn").addEventListener("click", openLangSheet);
  $("langsheet").addEventListener("click", (e) => { if (e.target === $("langsheet")) $("langsheet").hidden = true; });
  setInterval(() => { if (!$("home").hidden && !document.hidden) $("flipword").classList.toggle("rev"); }, 2600);
  $("help").addEventListener("click", () => { fillHelp(); $("sheet").hidden = false; $("sheet-ok").focus(); });
  $("sheet-ok").addEventListener("click", () => { $("sheet").hidden = true; });
  $("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) $("sheet").hidden = true; });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { $("sheet").hidden = true; $("langsheet").hidden = true; if (!$("micsheet").hidden) closeMicSheet(); } });
  window.addEventListener("resize", drawRing);

  /* ---------- pontuação: semelhança espectral + DTW ---------- */
  function fft(re, im) {
    const n = re.length;
    for (let i = 1, j = 0; i < n; i++) { let bit = n >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit;
      if (i < j) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; } }
    for (let len = 2; len <= n; len <<= 1) {
      const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
      for (let i = 0; i < n; i += len) { let cr = 1, ci = 0;
        for (let k = 0; k < len / 2; k++) { const a = i + k, b = a + len / 2;
          const xr = re[b] * cr - im[b] * ci, xi = re[b] * ci + im[b] * cr;
          re[b] = re[a] - xr; im[b] = im[a] - xi; re[a] += xr; im[a] += xi;
          const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t; } }
    }
  }
  function features(clip) {
    const f = Math.max(1, Math.round(clip.rate / 16000));
    const n = Math.floor(clip.data.length / f), x = new Float32Array(n);
    for (let i = 0; i < n; i++) { let s = 0; for (let k = 0; k < f; k++) s += clip.data[i * f + k]; x[i] = s / f; }
    const fs = clip.rate / f, N = 512, hop = Math.round(fs * 0.01), B = 24;
    const mel = (h) => 2595 * Math.log10(1 + h / 700), imel = (m) => 700 * (Math.pow(10, m / 2595) - 1);
    const lo = mel(80), hi = mel(Math.min(7000, fs / 2 - 100));
    const edges = []; for (let i = 0; i < B + 2; i++) edges.push(Math.floor(imel(lo + (hi - lo) * i / (B + 1)) / fs * N));
    const win = new Float32Array(N); for (let i = 0; i < N; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1));
    const raw = [], energy = [], re = new Float64Array(N), im = new Float64Array(N);
    for (let s = 0; s + N <= n; s += hop) {
      let e = 0;
      for (let i = 0; i < N; i++) { re[i] = x[s + i] * win[i]; im[i] = 0; e += x[s + i] * x[s + i]; }
      fft(re, im);
      const v = new Float32Array(B);
      for (let b = 0; b < B; b++) {
        const a = edges[b], c = edges[b + 1], z = Math.max(edges[b + 2], c + 1); let sum = 0;
        for (let k = a; k < z; k++) { const w = k < c ? (k - a) / Math.max(1, c - a) : (z - k) / Math.max(1, z - c); sum += w * (re[k] * re[k] + im[k] * im[k]); }
        v[b] = sum;
      }
      raw.push(v); energy.push(10 * Math.log10(e / N + 1e-10));
    }
    let peakBand = 0; for (const v of raw) for (let b = 0; b < B; b++) if (v[b] > peakBand) peakBand = v[b];
    const floor = peakBand * 3e-5 + 1e-12;
    const frames = raw.map((v) => v.map((y) => Math.log(y + floor)));
    let mx = -Infinity; for (const e of energy) if (e > mx) mx = e;
    let a = 0, z = energy.length - 1;
    while (a < z && energy[a] < mx - 30) a++;
    while (z > a && energy[z] < mx - 30) z--;
    let fr = frames.slice(a, z + 1);
    const mean = new Float32Array(B);
    for (const v of fr) for (let b = 0; b < B; b++) mean[b] += v[b] / fr.length;
    fr = fr.map((v) => v.map((y, b) => y - mean[b]));
    const MAXF = 250;
    if (fr.length > MAXF) {
      const out = [], r = fr.length / MAXF;
      for (let i = 0; i < MAXF; i++) {
        const s0 = Math.floor(i * r), s1 = Math.max(s0 + 1, Math.floor((i + 1) * r)), v = new Float32Array(B);
        for (let j = s0; j < s1; j++) for (let b = 0; b < B; b++) v[b] += fr[j][b] / (s1 - s0);
        out.push(v);
      }
      fr = out;
    }
    return { frames: fr, seconds: (z - a + 1) * hop / fs };
  }
  function cosDist(p, q) { let d = 0, a = 0, b = 0; for (let i = 0; i < p.length; i++) { d += p[i] * q[i]; a += p[i] * p[i]; b += q[i] * q[i]; } return 1 - d / (Math.sqrt(a * b) + 1e-9); }
  function dtw(A, Bf) {
    const n = A.length, m = Bf.length, INF = 1e18;
    let prev = new Float64Array(m + 1).fill(INF), cur = new Float64Array(m + 1); prev[0] = 0;
    for (let i = 1; i <= n; i++) {
      cur[0] = INF;
      for (let j = 1; j <= m; j++) { const c = cosDist(A[i - 1], Bf[j - 1]); cur[j] = Math.min(prev[j - 1] + 2 * c, prev[j] + c, cur[j - 1] + c); }
      const t = prev; prev = cur; cur = t;
    }
    return prev[m] / (n + m);
  }
  function similarity(c1, c2) {
    const f1 = features(c1), f2 = features(c2);
    if (f1.frames.length < 5 || f2.frames.length < 5) return 0;
    const d = dtw(f1.frames, f2.frames);
    let s = Math.min(1, Math.max(0, (0.6 - d) / 0.4));
    const r = Math.min(f1.seconds, f2.seconds) / Math.max(f1.seconds, f2.seconds);
    s *= 0.65 + 0.35 * r;
    return Math.round(100 * Math.pow(s, 0.85));
  }

  setLang(detectLang(), true);
  showHome();
  drawRing();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawRing);
})();
