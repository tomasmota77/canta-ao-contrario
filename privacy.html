<style>
:root { color-scheme: dark; --ink: #170A05; --paper: #FFFFFF; --muted: rgba(255,255,255,.62); --tomato: #FF5C82; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--ink); color: var(--paper); font-family: "Poppins", system-ui, -apple-system, sans-serif; line-height: 1.55;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)); }
main { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
a.back { color: var(--paper); text-decoration: none; font-weight: 700; display: inline-flex; gap: 8px; align-items: center; height: 40px; padding: 0 16px 0 12px; border-radius: 99px; background: rgba(255,255,255,.1); }
select { font: inherit; font-weight: 600; color: var(--paper); background: rgba(255,255,255,.1); border: 0; border-radius: 99px; height: 40px; padding: 0 14px; }
h1 { margin: 8px 0 0; font-family: "Poppins", system-ui, sans-serif; font-weight: 600; font-size: clamp(2.2rem, 9vw, 3rem); line-height: 1; letter-spacing: -.035em; }
.updated { margin: -10px 0 0; color: var(--muted); font-size: .92rem; }
.intro { margin: 0; font-size: 1.12rem; }
section h2 { margin: 0 0 6px; font-family: "Poppins", system-ui, sans-serif; font-weight: 600; font-size: 1.25rem; color: var(--tomato); }
section p { margin: 0; color: rgba(255,255,255,.85); }
a { color: var(--paper); }
</style>

<main>
  <div class="top">
    <a class="back" id="back" href="./"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="back-label">Voltar ao jogo</span></a>

</main>
<script>
(() => {
  const P = {"pt": {"lang": "Português (Portugal)", "title": "Política de privacidade", "updated": "Última atualização: 3 de novembro de 2026 (fotos dos jogadores)", "intro": "O Canta ao Contrário é um jogo que funciona inteiramente no teu telemóvel. Não tem contas, anúncios nem estatísticas de utilização, e não envia dados para nenhum servidor.", "sections": [["Microfone", "O jogo usa o microfone só quando tocas em gravar. O som é processado no próprio telemóvel (para o inverter e comparar) e fica apenas na memória enquanto jogas. Nunca é enviado nem guardado num servidor, e desaparece quando sais do jogo ou começas uma nova ronda."], ["Partilhar vídeos", "Se tocares em Partilhar, o vídeo é criado no telemóvel e és tu que escolhes para onde o envias (por exemplo WhatsApp ou TikTok). A partir daí, aplica-se a política de privacidade da app que escolheres."], ["O que fica guardado no telemóvel", "Para te poupar trabalho, o jogo guarda no telemóvel a língua, os nomes e as fotos dos jogadores (se as tirares), o recorde, o microfone escolhido e se os sons estão ligados. Estes dados nunca saem do telemóvel. Apagas tudo ao limpar os dados do site ou ao desinstalar a app."], ["Crianças", "O jogo não recolhe dados pessoais de ninguém, incluindo crianças."], ["Alterações", "Se esta política mudar, a nova versão aparece nesta página com a data atualizada."], ["Contacto", "Para dúvidas sobre privacidade, abre um pedido em github.com/tomasmota77/canta-ao-contrario/issues."]], "back": "Voltar ao jogo"}, "pt-BR": {"lang": "Português (Brasil)", "title": "Política de privacidade", "updated": "Última atualização: 3 de novembro de 2026 (fotos dos jogadores)", "intro": "O Canta ao Contrário é um jogo que funciona inteiramente no seu celular. Não tem contas, anúncios nem estatísticas de uso, e não envia dados para nenhum servidor.", "sections": [["Microfone", "O jogo usa o microfone só quando você toca em gravar. O áudio é processado no próprio celular (para inverter e comparar) e fica apenas na memória enquanto você joga. Nunca é enviado nem salvo em um servidor, e some quando você sai do jogo ou começa uma nova rodada."], ["Compartilhar vídeos", "Se você tocar em Compartilhar, o vídeo é criado no celular e você escolhe para onde enviar (por exemplo WhatsApp ou TikTok). A partir daí, vale a política de privacidade do app escolhido."], ["O que fica salvo no celular", "Para facilitar, o jogo salva no celular o idioma, os nomes e as fotos dos jogadores (se você tirar), o recorde, o microfone escolhido e se os sons estão ligados. Esses dados nunca saem do celular. Você apaga tudo limpando os dados do site ou desinstalando o app."], ["Crianças", "O jogo não coleta dados pessoais de ninguém, incluindo crianças."], ["Alterações", "Se esta política mudar, a nova versão aparece nesta página com a data atualizada."], ["Contato", "Para dúvidas sobre privacidade, abra uma solicitação em github.com/tomasmota77/canta-ao-contrario/issues."]], "back": "Voltar ao jogo"}, "en": {"lang": "English", "title": "Privacy policy", "updated": "Last updated: 3 November 2026", "intro": "Canta ao Contrário is a game that runs entirely on your phone. It has no accounts, no ads and no usage analytics, and it doesn't send data to any server.", "sections": [["Microphone", "The game only uses the microphone when you tap record. The audio is processed on your phone (to reverse and compare it) and is kept in memory only while you play. It is never uploaded or stored on a server, and it's gone when you leave the game or start a new round."], ["Sharing videos", "If you tap Share, the video is created on your phone and you choose where to send it (for example WhatsApp or TikTok). From then on, the privacy policy of the app you chose applies."], ["What's saved on your phone", "To save you time, the game stores your language, player names and photos (if you take them), best score, chosen microphone and sound setting on your phone. This data never leaves your phone. You can delete it by clearing the site's data or uninstalling the app."], ["Children", "The game doesn't collect personal data from anyone, including children."], ["Changes", "If this policy changes, the new version will appear on this page with an updated date."], ["Contact", "For privacy questions, open an issue at github.com/tomasmota77/canta-ao-contrario/issues."]], "back": "Back to the game"}, "es": {"lang": "Español", "title": "Política de privacidad", "updated": "Última actualización: 3 de noviembre de 2026", "intro": "Canta ao Contrário es un juego que funciona por completo en tu móvil. No tiene cuentas, anuncios ni estadísticas de uso, y no envía datos a ningún servidor.", "sections": [["Micrófono", "El juego solo usa el micrófono cuando tocas grabar. El audio se procesa en el propio móvil (para invertirlo y compararlo) y solo se guarda en memoria mientras juegas. Nunca se envía ni se guarda en un servidor, y desaparece al salir del juego o empezar una nueva ronda."], ["Compartir vídeos", "Si tocas Compartir, el vídeo se crea en el móvil y tú eliges a dónde enviarlo (por ejemplo WhatsApp o TikTok). A partir de ahí se aplica la política de privacidad de la app que elijas."], ["Lo que se guarda en el móvil", "Para ahorrarte trabajo, el juego guarda en el móvil el idioma, los nombres y las fotos de los jugadores (si las haces), el récord, el micrófono elegido y si los sonidos están activados. Estos datos nunca salen del móvil. Puedes borrarlos limpiando los datos del sitio o desinstalando la app."], ["Menores", "El juego no recoge datos personales de nadie, incluidos los menores."], ["Cambios", "Si esta política cambia, la nueva versión aparecerá en esta página con la fecha actualizada."], ["Contacto", "Para dudas sobre privacidad, abre una solicitud en github.com/tomasmota77/canta-ao-contrario/issues."]], "back": "Volver al juego"}, "fr": {"lang": "Français", "title": "Politique de confidentialité", "updated": "Dernière mise à jour : 3 novembre 2026", "intro": "Canta ao Contrário est un jeu qui fonctionne entièrement sur ton téléphone. Il n'a ni compte, ni publicité, ni statistiques d'utilisation, et n'envoie aucune donnée à un serveur.", "sections": [["Micro", "Le jeu utilise le micro uniquement quand tu touches enregistrer. Le son est traité sur le téléphone (pour l'inverser et le comparer) et reste seulement en mémoire pendant la partie. Il n'est jamais envoyé ni stocké sur un serveur, et disparaît quand tu quittes le jeu ou commences une nouvelle manche."], ["Partager des vidéos", "Si tu touches Partager, la vidéo est créée sur le téléphone et c'est toi qui choisis où l'envoyer (par exemple WhatsApp ou TikTok). Ensuite, c'est la politique de confidentialité de l'app choisie qui s'applique."], ["Ce qui est enregistré sur le téléphone", "Pour te faire gagner du temps, le jeu enregistre sur le téléphone la langue, les noms et les photos des joueurs (si tu en prends), le record, le micro choisi et le réglage des sons. Ces données ne quittent jamais le téléphone. Tu peux tout effacer en supprimant les données du site ou en désinstallant l'app."], ["Enfants", "Le jeu ne collecte aucune donnée personnelle, y compris celles des enfants."], ["Modifications", "Si cette politique change, la nouvelle version apparaîtra sur cette page avec la date mise à jour."], ["Contact", "Pour toute question sur la confidentialité, ouvre une demande sur github.com/tomasmota77/canta-ao-contrario/issues."]], "back": "Retour au jeu"}, "it": {"lang": "Italiano", "title": "Informativa sulla privacy", "updated": "Ultimo aggiornamento: 3 novembre 2026", "intro": "Canta ao Contrário è un gioco che funziona interamente sul tuo telefono. Non ha account, pubblicità né statistiche di utilizzo, e non invia dati a nessun server.", "sections": [["Microfono", "Il gioco usa il microfono solo quando tocchi registra. L'audio viene elaborato sul telefono (per invertirlo e confrontarlo) e resta in memoria solo mentre giochi. Non viene mai inviato né salvato su un server, e scompare quando esci dal gioco o inizi un nuovo turno."], ["Condividere video", "Se tocchi Condividi, il video viene creato sul telefono e sei tu a scegliere dove inviarlo (per esempio WhatsApp o TikTok). Da quel momento vale l'informativa sulla privacy dell'app scelta."], ["Cosa resta salvato sul telefono", "Per comodità, il gioco salva sul telefono la lingua, i nomi e le foto dei giocatori (se le scatti), il record, il microfono scelto e l'impostazione dei suoni. Questi dati non lasciano mai il telefono. Puoi cancellarli eliminando i dati del sito o disinstallando l'app."], ["Minori", "Il gioco non raccoglie dati personali di nessuno, minori compresi."], ["Modifiche", "Se questa informativa cambia, la nuova versione apparirà in questa pagina con la data aggiornata."], ["Contatti", "Per domande sulla privacy, apri una richiesta su github.com/tomasmota77/canta-ao-contrario/issues."]], "back": "Torna al gioco"}, "de": {"lang": "Deutsch", "title": "Datenschutzerklärung", "updated": "Zuletzt aktualisiert: 3. November 2026", "intro": "Canta ao Contrário ist ein Spiel, das komplett auf deinem Handy läuft. Es gibt keine Konten, keine Werbung und keine Nutzungsstatistiken, und es werden keine Daten an einen Server gesendet.", "sections": [["Mikrofon", "Das Spiel nutzt das Mikrofon nur, wenn du auf Aufnehmen tippst. Der Ton wird auf dem Handy verarbeitet (um ihn umzukehren und zu vergleichen) und bleibt nur während des Spiels im Speicher. Er wird nie hochgeladen oder auf einem Server gespeichert und verschwindet, wenn du das Spiel verlässt oder eine neue Runde beginnst."], ["Videos teilen", "Wenn du auf Teilen tippst, wird das Video auf dem Handy erstellt und du entscheidest, wohin du es schickst (zum Beispiel WhatsApp oder TikTok). Ab dann gilt die Datenschutzerklärung der gewählten App."], ["Was auf dem Handy gespeichert wird", "Damit du weniger tun musst, speichert das Spiel auf dem Handy die Sprache, die Namen und Fotos der Spieler (falls du welche machst), den Rekord, das gewählte Mikrofon und die Toneinstellung. Diese Daten verlassen nie dein Handy. Du kannst alles löschen, indem du die Websitedaten löschst oder die App deinstallierst."], ["Kinder", "Das Spiel erhebt von niemandem personenbezogene Daten, auch nicht von Kindern."], ["Änderungen", "Wenn sich diese Erklärung ändert, erscheint die neue Fassung auf dieser Seite mit aktualisiertem Datum."], ["Kontakt", "Bei Fragen zum Datenschutz eröffne eine Anfrage unter github.com/tomasmota77/canta-ao-contrario/issues."]], "back": "Zurück zum Spiel"}};
  const q = new URLSearchParams(location.search).get("lang");
  let saved = null; try { saved = localStorage.getItem("cac-lang"); } catch (e) {}
  const nav = (navigator.language || "en").toLowerCase();
  let L = (q && P[q]) ? q : (saved && P[saved]) ? saved : nav === "pt-br" ? "pt-BR" : P[nav.split("-")[0]] ? nav.split("-")[0] : "en";
  const sel = document.getElementById("lang");
  Object.keys(P).forEach((k) => { const o = document.createElement("option"); o.value = k; o.textContent = P[k].lang; sel.append(o); });
  function show() {
    const d = P[L]; sel.value = L; document.documentElement.lang = L;
    document.title = d.title + " · Canta ao Contrário";
    document.getElementById("title").textContent = d.title;
    document.getElementById("updated").textContent = d.updated;
    document.getElementById("intro").textContent = d.intro;
    document.getElementById("back-label").textContent = d.back;
    const box = document.getElementById("sections"); box.innerHTML = "";
    d.sections.forEach(([h, p]) => {
      const s = document.createElement("section"), h2 = document.createElement("h2"), pe = document.createElement("p");
      h2.textContent = h;
      const url = "github.com/tomasmota77/canta-ao-contrario/issues";
      if (p.includes(url)) { const [a, b] = p.split(url); const link = document.createElement("a"); link.href = "https://" + url; link.textContent = url; pe.append(a, link, b); }
      else pe.textContent = p;
      s.append(h2, pe); s.style.marginTop = "18px"; box.append(s);
    });
  }
  sel.addEventListener("change", () => { L = sel.value; show(); });
  show();
})();
</script>
